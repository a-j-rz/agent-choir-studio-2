<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Choir Studio V2</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 72rem; }
  #statusLine { margin: 0.75rem 0; font-weight: 600; }
  table { border-collapse: collapse; font-family: ui-monospace, monospace; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.25rem 0.6rem 0.25rem 0; border-bottom: 1px solid #ddd; vertical-align: top; }
  td.payload { word-break: break-word; }
</style>
</head>
<body>
<h1>Agent Choir Studio V2</h1>
<button id="freeBtn">Test run (free)</button>
<button id="liveBtn">Live run (~$0.0001)</button>
<div id="statusLine">idle</div>
<table>
  <thead><tr><th>received</th><th>trace ts</th><th>seq</th><th>type</th><th>role</th><th>payload</th></tr></thead>
  <tbody id="eventLog"></tbody>
</table>
<script>
  const buttons = [document.getElementById('freeBtn'), document.getElementById('liveBtn')];
  const statusLine = document.getElementById('statusLine');
  const eventLog = document.getElementById('eventLog');
  const TERMINAL = new Set(['run_complete', 'run_failed', 'run_aborted']);
  let controller = null;  // aborting it closes the stream; fetch never reconnects on its own

  // Short, human summary per event type. Unknown types fall back to the payload as JSON.
  function compact(d) {
    const p = d.payload;
    if (d.type === 'round_trip') {
      return `trip ${p.trip} · ${p.latency_s}s · in ${p.input_tokens} / out ${p.output_tokens} tok`
           + ` · reasoning ${p.reasoning_tokens} · $${p.est_cost_usd}`;
    }
    if (d.type === 'tool_result') return `${p.name} → ${JSON.stringify(p.result)}`;
    const s = JSON.stringify(p);
    return s.length > 300 ? s.slice(0, 300) + '…' : s;
  }

  function addRow(d) {
    const tr = document.createElement('tr');
    // Receive time in the same UTC ISO form as the trace's ts, so the two compare directly.
    [new Date().toISOString(), d.ts, d.seq, d.type, d.role, compact(d)].forEach((v, i) => {
      const td = document.createElement('td');
      td.textContent = v;
      if (i === 5) td.className = 'payload';
      tr.appendChild(td);
    });
    eventLog.appendChild(tr);
  }

  function finish(reason) {
    if (controller) { controller.abort(); controller = null; }
    statusLine.textContent = 'closed: ' + reason;
    buttons.forEach((b) => { b.disabled = false; });
  }

  // Hand-rolled SSE reader: events are separated by a blank line; the JSON is on the data: line.
  async function run(url) {
    if (controller) return;
    controller = new AbortController();
    const signal = controller.signal;
    eventLog.textContent = '';
    buttons.forEach((b) => { b.disabled = true; });
    statusLine.textContent = 'streaming ' + url + ' ...';
    try {
      const response = await fetch(url, { signal });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        let cut;
        while ((cut = buffer.indexOf('\n\n')) !== -1) {
          const block = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          const data = block.split('\n').filter((l) => l.startsWith('data:')).map((l) => l.slice(5)).join('\n');
          if (!data) continue;
          const d = JSON.parse(data);
          addRow(d);
          if (TERMINAL.has(d.type)) { finish(d.type); return; }
        }
      }
      finish('stream ended without a terminal event');
    } catch (err) {
      if (signal.aborted) return;  // we closed it ourselves in finish()
      finish('error: ' + err.message);
    }
  }

  document.getElementById('freeBtn').addEventListener('click', () => run('/stream'));
  document.getElementById('liveBtn').addEventListener('click', () => run('/stream/live'));
</script>
</body>
</html>
